<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b12">
<title>KILLA · Acceso</title>
<script>
  // Raíz de la web (la misma pantalla sirve como 404.html en cualquier ruta). Con doble clic (file://) la raíz es la
  // carpeta del proyecto y la Luna usa sus texturas incrustadas; publicada, se aplica la política de seguridad (CSP).
  (function () {
    var archivo = location.protocol === 'file:';
    var b = archivo ? location.href.replace(/[?#].*$/, '').replace(/acceso\/[^\/]*$/, '') : (location.pathname.indexOf('/icewise/') === 0 ? '/icewise/' : '/');
    document.write('<base href="' + b + '">');
    if (archivo) document.write('<script src="assets/img/luna/luna-local.js"><\/script>');
    else document.write('<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' \'wasm-unsafe-eval\'; style-src \'self\'; img-src \'self\' data: blob:; media-src \'self\' blob: mediastream:; connect-src \'self\' https://icewise-acceso.rone-robot.workers.dev http://localhost:8787; worker-src \'self\' blob:; object-src \'none\'; base-uri \'self\'; form-action \'none\'">');
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23ededf3' stroke-width='2'/%3E%3Ccircle cx='19' cy='16' r='8' fill='%23ededf3'/%3E%3C/svg%3E">
<link rel="preload" href="acceso/fuentes/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="acceso/acceso.css?v=6">
</head>
<body>
<!-- fondo: la misma Luna 3D, espacio e iluminación de la portada (js/hero-moon.js) -->
<div class="ac-espacio" aria-hidden="true">
  <span class="ac-sensor" id="inicio"></span>
  <div class="hero-media ac-media"><div class="hero-moon" id="hero-moon"></div></div>
</div>

<header class="ac-top">
  <span class="ac-marca">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#ededf3" stroke-width="1.4"/><circle cx="16" cy="16" r="9" fill="none" stroke="#ededf3" stroke-width="1.4" opacity=".5"/><circle cx="19.5" cy="16" r="5" fill="#ededf3"/></svg>
    KILLA
    <span class="ac-bandera" role="img" aria-label="Perú"><svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#D91023"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#D91023"/></svg></span>
  </span>
  <span class="ac-top-der">
    <button type="button" class="ac-idioma" id="ac-idioma" translate="no" aria-label="Language / Idioma"><span data-l="en">EN</span><span data-l="es">ES</span></button>
    <img class="ac-escudo" src="acceso/escudo.png" alt="Clemente Althaus School" width="23" height="32">
  </span>
</header>

<main class="ac" id="ac">
  <!-- presentación, con el lenguaje de la portada -->
  <section class="ac-intro">
    <p class="ac-k"><i aria-hidden="true"></i><span data-t="k"></span></p>
    <h1 class="ac-titulo"><span class="ac-titulo-marca">KILLA</span><span class="ac-titulo-lema" data-t="lema"></span></h1>
    <p class="ac-intro-p" data-t="intro"></p>
  </section>

  <!-- tarjeta de inicio de sesión -->
  <section class="ac-tarjeta" aria-labelledby="ac-tarjeta-t">
    <div class="ac-vista" data-vista="inicio">
      <h2 id="ac-tarjeta-t" data-t="entrarT"></h2>
      <p class="ac-sub" data-t="entrarP"></p>
      <button type="button" class="ac-metodo ac-metodo--pri" id="ac-ir-rostro">
        <span class="ac-metodo-i"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v.5M15 10v.5M12 10v3.5h-1M9.5 16c1.4 1 3.6 1 5 0"/></svg></span>
        <span class="ac-metodo-t"><b data-t="conRostro"></b><small data-t="conRostroP"></small></span>
        <svg class="ac-metodo-f" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="ac-metodo" id="ac-ir-pin">
        <span class="ac-metodo-i"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7.5 12h.01M10.5 12h.01M13.5 12h.01M16.5 12h.01"/></svg></span>
        <span class="ac-metodo-t"><b data-t="conPin"></b><small data-t="conPinP"></small></span>
        <svg class="ac-metodo-f" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="ac-local" id="ac-local" hidden>
        <p data-t="localP"></p>
        <a class="ac-btn ac-btn--sec" href="index.html?local" data-t="localVer"></a>
      </div>
    </div>

    <!-- rostro -->
    <div class="ac-vista" data-vista="rostro" hidden>
      <div class="ac-cab"><button type="button" class="ac-atras" data-volver data-t-aria="volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h2 data-t="conRostro"></h2></div>
      <div class="ac-cam" id="ac-cam">
        <video id="ac-video" playsinline muted autoplay></video>
        <svg class="ac-anillo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" class="ac-anillo-f"/><circle cx="50" cy="50" r="48" class="ac-anillo-p" id="ac-progreso"/></svg>
        <div class="ac-cam-cargando" id="ac-cam-cargando"><span class="ac-giro" aria-hidden="true"></span></div>
      </div>
      <p class="ac-instr" id="ac-instr" aria-live="polite"></p>
      <p class="ac-diag" id="ac-diag" hidden></p>
    </div>

    <!-- PIN -->
    <form class="ac-vista" data-vista="pin" id="ac-form-pin" hidden autocomplete="off">
      <div class="ac-cab"><button type="button" class="ac-atras" data-volver data-t-aria="volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><h2 data-t="conPin"></h2></div>
      <label class="ac-lbl" for="ac-d0" id="ac-pin-lbl" data-t="pinLbl"></label>
      <div class="ac-pin" id="ac-pin">
        <input id="ac-d0" inputmode="numeric" maxlength="1" aria-label="1"><input inputmode="numeric" maxlength="1" aria-label="2"><input inputmode="numeric" maxlength="1" aria-label="3">
        <span class="ac-pin-sep" aria-hidden="true"></span>
        <input inputmode="numeric" maxlength="1" aria-label="4"><input inputmode="numeric" maxlength="1" aria-label="5"><input inputmode="numeric" maxlength="1" aria-label="6">
      </div>
      <button type="submit" class="ac-btn" id="ac-entrar-pin"><span data-t="entrar"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>

    <!-- acceso denegado -->
    <div class="ac-vista ac-denegado" data-vista="denegado" hidden>
      <div class="ac-den-i"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg></div>
      <h2 class="ac-den-t" data-t="denT"></h2>
      <p class="ac-sub" data-t="denP"></p>
      <button type="button" class="ac-btn ac-btn--sec" data-volver data-t="volver"></button>
    </div>

    <p class="ac-estado" id="ac-estado" role="status" aria-live="polite"></p>
  </section>
</main>

<p class="ac-falso" id="ac-falso" hidden data-t="falso"></p>
<script src="acceso/idioma.js?v=1" defer></script>
<script src="acceso/luna/assets/vendor/three-r170.js" defer></script>
<script src="acceso/luna/assets/sky/estrellas.js" defer></script>
<script src="acceso/luna/js/hero-moon.js?v=1" defer></script>
<script src="acceso/acceso.js?v=11" defer></script>
</body>
</html>
